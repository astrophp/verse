name: install

# Installs the archive of the commit (what a tag ships) and checks that `verse init` and
# `verse build` work from it, both run from the extracted archive and installed as a Composer
# dependency. On main it runs for every push, with no path filter, so a release can require it green
# for the tagged commit.
#
# A pull request runs it unless every changed file is one that cannot reach the shipped archive:
# docs, tests, art and the Markdown files that are export-ignored. The filter is inverted on
# purpose: a new top-level file matches no list of shipped paths, and the archive allowlist check
# has to see it before the merge, not after. The Markdown files are named one by one, not with a
# glob, so a new one still runs the check; README.md ships and is not excluded.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!tests/**'
      - '!art/**'
      - '!ROADMAP.md'
      - '!SECURITY.md'
      - '!CLAUDE.md'
      - '!CONTRIBUTING.md'
      - '!CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  # Never cancel a run on main: a release requires it green for the tagged commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none

      - name: Install test
        run: scripts/install-test.sh
